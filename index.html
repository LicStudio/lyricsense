<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricSense - Smart Audio & Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animated gradient background with cohesive matching tones */
        body {
            background: linear-gradient(-45deg, #0b0f19, #1b1834, #271f47, #131d36);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Custom Range Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            transition: background 0.2s;
        }
        input[type=range]:hover::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.35);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Lyrics Container and Animations */
        #lyrics-wrapper {
            position: relative;
            height: calc(100vh - 280px);
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
        }

        #lyrics-container {
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: absolute;
            width: 100%;
            padding: 50vh 0;
        }

        .lyric-line {
            transition: all 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: center center;
            will-change: transform, opacity, color;
        }

        /* Active lyric line styling (like Apple Music lyric view) */
        .lyric-active {
            color: #ffffff;
            font-size: 2.2rem;
            line-height: 1.3;
            opacity: 1;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(168, 85, 247, 0.3);
            transform: scale(1.05);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }

        @media (max-width: 640px) {
            .lyric-active {
                font-size: 1.6rem;
            }
            .lyric-inactive {
                font-size: 1.1rem;
            }
        }

        /* Inactive lyric line styling */
        .lyric-inactive {
            color: #94a3b8;
            font-size: 1.3rem;
            line-height: 1.4;
            opacity: 0.35;
            font-weight: 600;
            transform: scale(0.96);
        }

        .lyric-inactive:hover {
            opacity: 0.75;
            color: #e2e8f0;
        }

        /* Loading Ring */
        .loader-ring {
            display: inline-block;
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border-top-color: #a855f7;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6 select-none">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-red-500/90 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3 border border-red-400/30">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toast-message" class="text-sm font-medium">Error</span>
    </div>

    <!-- Header / Navigation Bar -->
    <header class="w-full max-w-4xl flex justify-between items-center relative z-20 py-2">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-purple-200">
                LyricSense
            </h1>
        </div>
        
        <!-- Media File Selector Button -->
        <label for="media-upload" class="cursor-pointer glass-panel hover:bg-white/15 px-4 sm:px-5 py-2.5 rounded-full flex items-center gap-2 transition-all shadow-xl active:scale-95 group border-white/20">
            <svg class="w-5 h-5 text-purple-300 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <span class="font-semibold text-xs sm:text-sm tracking-wide">Subir Audio o Video</span>
            <input type="file" id="media-upload" accept="audio/*,video/*" class="hidden">
        </label>
    </header>

    <!-- Main Content Display -->
    <main class="flex-grow w-full max-w-4xl relative z-10 flex flex-col justify-center my-2 overflow-hidden">
        
        <!-- Status View (Upload Prompt, Audio Processing Progress) -->
        <div id="status-container" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 transition-all duration-500 z-20">
            <div id="loading-spinner" class="loader-ring mb-5 hidden"></div>
            <h2 id="status-title" class="text-2xl sm:text-3xl font-bold mb-3 text-white">
                Sube cualquier canción o video
            </h2>
            <p id="status-desc" class="text-sm sm:text-base text-gray-300 max-w-md leading-relaxed">
                Admite archivos de <b>cualquier tamaño</b> (MP3, WAV, FLAC, MP4, etc.). El audio se procesará para sincronizar las letras con inteligencia artificial.
            </p>
            <div id="progress-indicator" class="w-full max-w-xs bg-white/10 rounded-full h-2 mt-5 hidden overflow-hidden">
                <div id="progress-bar-fill" class="bg-gradient-to-r from-purple-500 to-indigo-400 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Video Player Display Container (shown if video is uploaded) -->
        <div id="video-container" class="hidden w-full mb-4 rounded-2xl overflow-hidden glass-panel shadow-2xl relative max-h-60 sm:max-h-72 flex justify-center bg-black/40">
            <video id="video-element" class="h-full max-h-60 sm:max-h-72 object-contain w-full"></video>
        </div>

        <!-- Lyrics Viewport (Scrollable lyric lines) -->
        <div id="lyrics-wrapper" class="w-full opacity-0 transition-opacity duration-700">
            <div id="lyrics-container" class="flex flex-col gap-5 sm:gap-7 items-center text-center px-4">
                <!-- Lyric lines will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <!-- Hidden Audio Element (for audio files) -->
    <audio id="audio-element" class="hidden"></audio>

    <!-- Bottom Floating Player Bar -->
    <footer id="player-controls" class="w-full max-w-4xl glass-panel p-4 sm:p-5 rounded-3xl shadow-2xl opacity-0 transform translate-y-10 transition-all duration-500 z-30 flex flex-col gap-3">
        
        <!-- Scrubber Bar & Timers -->
        <div class="flex items-center gap-3 sm:gap-4 w-full text-xs font-mono text-gray-300">
            <span id="time-current" class="w-10 text-right">00:00</span>
            <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" class="flex-grow">
            <span id="time-total" class="w-10">00:00</span>
        </div>

        <!-- Control Buttons Grid -->
        <div class="flex justify-between items-center mt-1">
            
            <!-- Left Options: Speed Selector & Video Toggle -->
            <div class="flex items-center gap-2">
                <button id="btn-speed" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-mono font-bold transition-all text-purple-200">
                    1.0x
                </button>
                <button id="btn-toggle-video" class="hidden px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium transition-all text-gray-200 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>Video</span>
                </button>
            </div>

            <!-- Center Controls: Rewind, Play/Pause, Forward -->
            <div class="flex justify-center items-center gap-4 sm:gap-6">
                <!-- Rewind 10s -->
                <button id="btn-rewind" title="Retroceder 10s" class="text-white/70 hover:text-white transition-colors active:scale-90">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"></path></svg>
                </button>
                
                <!-- Play/Pause Button -->
                <button id="btn-play-pause" class="bg-white text-indigo-950 rounded-full p-3.5 sm:p-4 shadow-xl hover:scale-105 active:scale-95 transition-all">
                    <!-- Play Icon -->
                    <svg id="icon-play" class="w-7 h-7 sm:w-8 sm:h-8 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    <!-- Pause Icon -->
                    <svg id="icon-pause" class="w-7 h-7 sm:w-8 sm:h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>

                <!-- Forward 10s -->
                <button id="btn-forward" title="Adelantar 10s" class="text-white/70 hover:text-white transition-colors active:scale-90">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z"></path></svg>
                </button>
            </div>

            <!-- Right Options: Volume Control -->
            <div class="flex items-center gap-2 w-24 justify-end">
                <button id="btn-mute" class="text-gray-300 hover:text-white transition-colors">
                    <svg id="icon-vol-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"></path></svg>
                    <svg id="icon-vol-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                </button>
                <input type="range" id="volume-bar" value="100" min="0" max="100" class="w-16">
            </div>
        </div>
    </footer>

    <script>
        // UI Elements
        const mediaUpload = document.getElementById('media-upload');
        const audioElement = document.getElementById('audio-element');
        const videoElement = document.getElementById('video-element');
        const videoContainer = document.getElementById('video-container');
        const btnToggleVideo = document.getElementById('btn-toggle-video');
        
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        
        const statusContainer = document.getElementById('status-container');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const loadingSpinner = document.getElementById('loading-spinner');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const progressIndicator = document.getElementById('progress-indicator');
        
        const lyricsWrapper = document.getElementById('lyrics-wrapper');
        const lyricsContainer = document.getElementById('lyrics-container');
        const playerControls = document.getElementById('player-controls');
        
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const btnSpeed = document.getElementById('btn-speed');
        const btnMute = document.getElementById('btn-mute');
        const iconVolOn = document.getElementById('icon-vol-on');
        const iconVolOff = document.getElementById('icon-vol-off');
        const volumeBar = document.getElementById('volume-bar');

        // Application State
        let activeMediaElement = audioElement; // Either audioElement or videoElement
        let lyricsData = [];
        let currentActiveIndex = -1;
        let isDraggingProgress = false;
        let playbackSpeeds = [0.75, 1.0, 1.25, 1.5, 2.0];
        let currentSpeedIndex = 1;
        let isMuted = false;
        let lastVolume = 1.0;
        
        const API_KEY = ""; // Automatically injected at runtime in Canvas environment

        // Helper: Format seconds to MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Helper: Display Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-x-full');
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 5000);
        }

        // Helper: Update Status View
        function setStatus(title, desc, isLoading = false, progressPercent = null) {
            statusTitle.innerText = title;
            statusDesc.innerText = desc;
            
            if (isLoading) {
                loadingSpinner.classList.remove('hidden');
            } else {
                loadingSpinner.classList.add('hidden');
            }

            if (progressPercent !== null) {
                progressIndicator.classList.remove('hidden');
                progressBarFill.style.width = `${progressPercent}%`;
            } else {
                progressIndicator.classList.add('hidden');
            }
        }

        /**
         * Converts any Audio/Video file into a lightweight 16kHz Mono WAV Float32/Int16 PCM Buffer
         * This allows uploading 100MB+ WAV files or MP4 videos instantly without overloading the API.
         */
        async function extractAndCompressAudio(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 40);
                        setStatus(
                            "Leyendo archivo...",
                            `Cargando ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)...`,
                            true,
                            percent
                        );
                    }
                };

                reader.onload = async (e) => {
                    try {
                        setStatus("Optimizando audio...", "Decodificando pistas vocales e instrumentales...", true, 50);
                        
                        const arrayBuffer = e.target.result;
                        // Use standard Web AudioContext
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                        setStatus("Comprimiendo para IA...", "Creando representación ligera de alta fidelidad para transcripción...", true, 75);

                        // Downsample to 16000Hz Mono for Gemini
                        const targetSampleRate = 16000;
                        const offlineCtx = new OfflineAudioContext(1, Math.ceil(decodedBuffer.duration * targetSampleRate), targetSampleRate);
                        
                        const source = offlineCtx.createBufferSource();
                        source.buffer = decodedBuffer;
                        source.connect(offlineCtx.destination);
                        source.start(0);

                        const renderedBuffer = await offlineCtx.startRendering();
                        
                        // Convert rendered OfflineAudioBuffer to PCM 16-bit WAV Blob
                        const wavBlob = audioBufferToWavBlob(renderedBuffer);
                        
                        // Convert WAV Blob to Base64
                        const blobReader = new FileReader();
                        blobReader.onloadend = () => {
                            const base64Data = blobReader.result.split(',')[1];
                            setStatus("Sincronizando con IA...", "Enviando a Gemini para detección precisa de letras y tiempos...", true, 90);
                            resolve({ base64Data, mimeType: "audio/wav" });
                        };
                        blobReader.onerror = reject;
                        blobReader.readAsDataURL(wavBlob);

                    } catch (err) {
                        reject(err);
                    }
                };

                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        // Helper: Convert AudioBuffer to standard 16-bit PCM WAV Blob
        function audioBufferToWavBlob(buffer) {
            const numChannels = 1;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const samples = buffer.getChannelData(0);
            const dataSize = samples.length * bytesPerSample;
            const bufferSize = 44 + dataSize;
            
            const arrayBuffer = new ArrayBuffer(bufferSize);
            const view = new DataView(arrayBuffer);
            
            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, samples[i]));
                s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                view.setInt16(offset, s, true);
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        mediaUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Reset UI
            lyricsData = [];
            lyricsContainer.innerHTML = '';
            lyricsWrapper.classList.remove('opacity-100');
            lyricsWrapper.classList.add('opacity-0');
            playerControls.classList.remove('opacity-100', 'translate-y-0');
            playerControls.classList.add('opacity-0', 'translate-y-10');
            
            if (activeMediaElement) {
                activeMediaElement.pause();
            }

            // Setup Media Element (Audio vs Video)
            const isVideo = file.type.startsWith('video/');
            const objectUrl = URL.createObjectURL(file);

            if (isVideo) {
                activeMediaElement = videoElement;
                videoElement.src = objectUrl;
                audioElement.src = '';
                videoContainer.classList.remove('hidden');
                btnToggleVideo.classList.remove('hidden');
            } else {
                activeMediaElement = audioElement;
                audioElement.src = objectUrl;
                videoElement.src = '';
                videoContainer.classList.add('hidden');
                btnToggleVideo.classList.add('hidden');
            }

            statusContainer.style.opacity = '1';
            statusContainer.classList.remove('hidden');

            try {
                // Step 1: Compress audio locally (handles files of ANY size!)
                const compressedAudio = await extractAndCompressAudio(file);

                // Step 2: Request structured lyrics from Gemini API
                await fetchLyricsFromGemini(compressedAudio.base64Data, compressedAudio.mimeType);

            } catch (error) {
                console.error("Processing error:", error);
                setStatus("Error al procesar el archivo", "Asegúrate de que el archivo no esté dañado o intenta con otro formato.", false);
                showToast("Ocurrió un error procesando el audio.");
            }
        });

        // Call Gemini API with tailored prompt for Song Lyrics and precise sync
        async function fetchLyricsFromGemini(base64Audio, mimeType) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;

            const systemPrompt = `You are an expert musical lyric transcriber and time-synchronizer.
Listen to the provided audio track (which contains singing, lead/backing vocals, and instrumental music background).
Task:
1. Transcribe the singing vocals with high precision in their original language.
2. Group the lyrics naturally into lyric lines (verse, chorus, phrase).
3. Ignore long instrumental breaks or non-vocal sections.
4. Output a JSON array where each element contains:
   - 'start': exact start time in seconds (float) when the line starts being sung
   - 'end': exact end time in seconds (float) when the line finishes
   - 'text': string containing the lyric phrase
Ensure timestamps are strictly synchronized to act like a real-time Lyric Video player.`;

            const payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: systemPrompt },
                        {
                            inlineData: {
                                mimeType: mimeType,
                                data: base64Audio
                            }
                        }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "start": { type: "NUMBER" },
                                "end": { type: "NUMBER" },
                                "text": { type: "STRING" }
                            },
                            required: ["start", "end", "text"]
                        }
                    }
                }
            };

            let retries = 3;
            let delay = 1000;

            while (retries > 0) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Error API (${response.status})`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
                        const rawJson = result.candidates[0].content.parts[0].text;
                        lyricsData = JSON.parse(rawJson);

                        if (!lyricsData || lyricsData.length === 0) {
                            throw new Error("No se detectaron letras vocales en la canción.");
                        }

                        // Ensure chronological ordering
                        lyricsData.sort((a, b) => a.start - b.start);
                        
                        renderLyrics();
                        setupPlayer();
                        return;
                    } else {
                        throw new Error("Respuesta de IA sin contenido válido.");
                    }

                } catch (err) {
                    retries--;
                    if (retries === 0) {
                        throw err;
                    }
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2; // exponential backoff
                }
            }
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            lyricsData.forEach((lyric, index) => {
                const line = document.createElement('div');
                line.className = 'lyric-line lyric-inactive cursor-pointer px-4 max-w-2xl text-center select-none';
                line.id = `lyric-${index}`;
                line.innerText = lyric.text;
                
                // Clicking line seeks audio to exact timestamp
                line.addEventListener('click', () => {
                    activeMediaElement.currentTime = lyric.start;
                    activeMediaElement.play();
                });

                lyricsContainer.appendChild(line);
            });

            // Hide status overlay, display lyric player
            statusContainer.style.opacity = '0';
            setTimeout(() => {
                statusContainer.classList.add('hidden');
                lyricsWrapper.classList.remove('opacity-0');
                lyricsWrapper.classList.add('opacity-100');
                playerControls.classList.remove('opacity-0', 'translate-y-10');
                playerControls.classList.add('opacity-100', 'translate-y-0');
            }, 400);

            currentActiveIndex = -1;
            updateLyricsScroll(0);
        }

        // Smooth vertical scrolling alignment logic for lyrics
        function updateLyricsScroll(currentTime) {
            if (!lyricsData || lyricsData.length === 0) return;

            let newActiveIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                // Line remains active from start time until next line starts or end
                const nextStart = (i < lyricsData.length - 1) ? lyricsData[i+1].start : lyricsData[i].end + 2;
                if (currentTime >= lyricsData[i].start && currentTime < nextStart) {
                    newActiveIndex = i;
                    break;
                }
            }

            if (newActiveIndex !== currentActiveIndex) {
                // Remove highlight from old line
                if (currentActiveIndex !== -1) {
                    const prevEl = document.getElementById(`lyric-${currentActiveIndex}`);
                    if (prevEl) {
                        prevEl.classList.remove('lyric-active');
                        prevEl.classList.add('lyric-inactive');
                    }
                }

                // Apply highlight to active line
                if (newActiveIndex !== -1) {
                    const activeEl = document.getElementById(`lyric-${newActiveIndex}`);
                    if (activeEl) {
                        activeEl.classList.remove('lyric-inactive');
                        activeEl.classList.add('lyric-active');
                        
                        // Align active line exactly in the middle of lyrics wrapper
                        const wrapperCenter = lyricsWrapper.clientHeight / 2;
                        const activeCenter = activeEl.offsetTop + (activeEl.clientHeight / 2);
                        const translateY = wrapperCenter - activeCenter;
                        
                        lyricsContainer.style.transform = `translateY(${translateY}px)`;
                    }
                } else if (currentTime < lyricsData[0].start) {
                    lyricsContainer.style.transform = `translateY(0px)`;
                }

                currentActiveIndex = newActiveIndex;
            }
        }

        function setupPlayer() {
            iconPlay.classList.remove('hidden');
            iconPause.classList.add('hidden');
            progressBar.value = 0;

            const updateDuration = () => {
                if (activeMediaElement.duration) {
                    progressBar.max = activeMediaElement.duration;
                    timeTotal.innerText = formatTime(activeMediaElement.duration);
                }
            };

            activeMediaElement.onloadedmetadata = updateDuration;
            updateDuration();
        }

        // Play / Pause Toggle
        function togglePlayPause() {
            if (activeMediaElement.paused) {
                activeMediaElement.play();
            } else {
                activeMediaElement.pause();
            }
        }

        btnPlayPause.addEventListener('click', togglePlayPause);

        // Bind Play/Pause events to sync icon status
        [audioElement, videoElement].forEach(media => {
            media.addEventListener('play', () => {
                if (media === activeMediaElement) {
                    iconPlay.classList.add('hidden');
                    iconPause.classList.remove('hidden');
                }
            });

            media.addEventListener('pause', () => {
                if (media === activeMediaElement) {
                    iconPause.classList.add('hidden');
                    iconPlay.classList.remove('hidden');
                }
            });

            media.addEventListener('timeupdate', () => {
                if (media === activeMediaElement) {
                    const cur = media.currentTime;
                    if (!isDraggingProgress) {
                        progressBar.value = cur;
                    }
                    timeCurrent.innerText = formatTime(cur);
                    updateLyricsScroll(cur);
                }
            });
        });

        // Scrubber Slider Interactions
        progressBar.addEventListener('mousedown', () => isDraggingProgress = true);
        progressBar.addEventListener('touchstart', () => isDraggingProgress = true, { passive: true });

        progressBar.addEventListener('mouseup', (e) => {
            isDraggingProgress = false;
            activeMediaElement.currentTime = e.target.value;
        });

        progressBar.addEventListener('touchend', (e) => {
            isDraggingProgress = false;
            activeMediaElement.currentTime = e.target.value;
        });

        progressBar.addEventListener('input', (e) => {
            timeCurrent.innerText = formatTime(e.target.value);
            updateLyricsScroll(e.target.value);
        });

        // Skip Buttons (-10s / +10s)
        btnRewind.addEventListener('click', () => {
            activeMediaElement.currentTime = Math.max(0, activeMediaElement.currentTime - 10);
        });

        btnForward.addEventListener('click', () => {
            activeMediaElement.currentTime = Math.min(activeMediaElement.duration || 0, activeMediaElement.currentTime + 10);
        });

        // Speed Selector
        btnSpeed.addEventListener('click', () => {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const speed = playbackSpeeds[currentSpeedIndex];
            audioElement.playbackRate = speed;
            videoElement.playbackRate = speed;
            btnSpeed.innerText = `${speed.toFixed( speed % 1 === 0 ? 1 : 2 )}x`;
        });

        // Mute & Volume Slider Controls
        btnMute.addEventListener('click', () => {
            isMuted = !isMuted;
            activeMediaElement.muted = isMuted;
            if (isMuted) {
                iconVolOn.classList.add('hidden');
                iconVolOff.classList.remove('hidden');
                volumeBar.value = 0;
            } else {
                iconVolOff.classList.add('hidden');
                iconVolOn.classList.remove('hidden');
                volumeBar.value = lastVolume * 100;
            }
        });

        volumeBar.addEventListener('input', (e) => {
            const val = e.target.value / 100;
            activeMediaElement.volume = val;
            lastVolume = val;
            if (val === 0) {
                isMuted = true;
                iconVolOn.classList.add('hidden');
                iconVolOff.classList.remove('hidden');
            } else {
                isMuted = false;
                iconVolOff.classList.add('hidden');
                iconVolOn.classList.remove('hidden');
            }
        });

        // Video View Toggle
        btnToggleVideo.addEventListener('click', () => {
            if (videoContainer.classList.contains('hidden')) {
                videoContainer.classList.remove('hidden');
            } else {
                videoContainer.classList.add('hidden');
            }
        });

        // Keyboard Shortcuts (Space to play/pause, Left/Right arrows to seek)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'ArrowLeft' && e.target.tagName !== 'INPUT') {
                activeMediaElement.currentTime = Math.max(0, activeMediaElement.currentTime - 5);
            } else if (e.code === 'ArrowRight' && e.target.tagName !== 'INPUT') {
                activeMediaElement.currentTime = Math.min(activeMediaElement.duration || 0, activeMediaElement.currentTime + 5);
            }
        });
    </script>
</body>
</html>
